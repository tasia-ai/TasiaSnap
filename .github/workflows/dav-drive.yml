name: dav-drive-builds

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - "v*"

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake ninja-build extra-cmake-modules gettext \
            qt6-base-dev libqt6svg6-dev qt6-tools-dev qt6-l10n-tools qt6-tools-dev-tools \
            qt6-base-private-dev libxcb-xfixes0-dev libxcb-cursor-dev \
            libssl-dev libgl-dev libopengl-dev

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_QT6=ON \
            -DUSE_SUBMODULE_KCOLORPICKER=ON \
            -DUSE_SUBMODULE_KIMAGEANNOTATOR=ON \
            -DBUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke test
        run: |
          sudo apt-get install -y -qq xvfb
          xvfb-run -a ./build/src/ksnip -v || true

      - name: Stage artifact
        run: |
          mkdir -p stage/ksnip-linux-x64/translations
          cp build/src/ksnip stage/ksnip-linux-x64/
          cp build/translations/*.qm stage/ksnip-linux-x64/translations/
          cp dav-drive/dav-drive-upload.sh dav-drive/configure-ksnip.sh dav-drive/README.txt dav-drive/tasiasnap-record.sh stage/ksnip-linux-x64/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ksnip-linux-x64
          path: stage/ksnip-linux-x64

  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.2.4'
          host: 'windows'
          arch: 'win64_msvc2019_64'
          install-deps: 'true'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_WITH_QT6=ON `
            -DUSE_SUBMODULE_KCOLORPICKER=ON `
            -DUSE_SUBMODULE_KIMAGEANNOTATOR=ON `
            -DBUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage artifact
        shell: bash
        run: |
          # cmake install runs windeployqt (ksnip install(CODE)) -> Qt DLLs land next to ksnip.exe
          cmake --install build --config Release --prefix "$PWD/stage/ksnip-windows-x64"
          cp dav-drive/configure-ksnip.cmd dav-drive/README.txt dav-drive/dav-drive-upload.sh dav-drive/tasiasnap-record.sh stage/ksnip-windows-x64/

      - name: Build Dav Drive Windows helpers
        shell: bash
        run: |
          cd dav-drive/uploader
          go build -trimpath -ldflags="-s -w" -o ../../stage/ksnip-windows-x64/dav-drive-uploader.exe .
          cd ../recorder
          go build -trimpath -ldflags="-s -w" -o ../../stage/ksnip-windows-x64/dav-drive-record.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ksnip-windows-x64
          path: stage/ksnip-windows-x64